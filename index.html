<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b111b">
  <meta name="color-scheme" content="dark light">
  <title>FIFA Tournament Manager</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var t=localStorage.getItem('ftm:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo" aria-hidden="true">⚽</span><span>Torneos</span></div>
      <nav id="nav" aria-label="Secciones"></nav>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <h1 id="section-title">Inicio</h1>
        <span id="tournament-pill" class="pill"></span>
        <button id="theme-toggle" class="icon-btn" type="button"></button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación rápida"></nav>
  </div>
  <div id="toast-region" class="toast-region" role="region" aria-label="Notificaciones" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
