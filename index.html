<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIFA Tournament Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">⚽ <span>Tournament Manager</span></div>
      <nav id="nav" aria-label="Navegación principal"></nav>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="Abrir menú">☰</button>
        <h1 id="section-title">Inicio</h1>
        <span id="tournament-pill" class="pill"></span>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
